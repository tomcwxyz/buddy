name: Browser flow

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: buddy-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  play-flow:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Buddy
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/buddy-dev.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/buddy-dev.log
          exit 1

      - name: Test Play flow
        run: npm run test:e2e
